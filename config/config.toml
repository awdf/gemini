# Debug enables verbose logging for development and debugging purposes.
Debug = false
# Trace enables extremely verbose logging, including low-level API calls and data streams.
# This should generally only be enabled for deep debugging.
Trace = false

# LiveAI, if true, enables the Live AI streaming mode.
# In this mode, audio is continuously streamed to the AI for real-time interaction,
# and tool calls are handled asynchronously.
LiveAI = false

# Mode controls the initial operating mode of the AI.
# "prompt": Standard text-based interaction.
# "system": Enables a system shell for command execution.
# "image": Enables screenshot capture with each prompt.
Mode = "prompt"

# LogFile specifies the path to the application's log file.
LogFile = "gemini.log"

[ai]
# Timezone sets the timezone for time-related prompts sent to the AI.
# E.g., "America/New_York", "Europe/Berlin", "Asia/Tokyo".
Timezone = "UTC"

# Model specifies the default Gemini model for text-based interactions.
Model = "gemini-2.5-flash"
ModelRPM = 10 # Requests per minute for Model

# ModelTTS specifies the model used for text-to-speech generation.
ModelTTS = "gemini-2.5-flash-preview-tts"
ModelTTSRPM = 15 # Requests per minute for ModelTTS

# ModelLive specifies the Gemini model for live streaming text interactions.
# This model is optimized for low-latency, real-time responses.
ModelLive = "gemini-live-2.5-flash-preview"
ModelLiveRPM = 250 # Requests per minute for ModelLive

# ModelLiveTTS specifies the Gemini model for live streaming audio interactions (text-to-speech enabled).
# This model supports interleaved audio input and output.
ModelLiveTTS = "gemini-live-2.5-flash-preview"
ModelLiveTTSRPM = 5 # Requests per minute for ModelLiveTTS

# ModelObjectDetection specifies the Gemini model for object detection.
ModelObjectDetection = "gemini-2.5-flash"
ModelObjectDetectionRPM = 10 # Requests per minute for ModelObjectDetection

# TranscriptionPrompt is the instruction sent to the AI for transcribing audio.
TranscriptionPrompt = "Please provide a verbatim transcript of the audio."

# Voice specifies the name of the voice to use for AI voice responses (e.g., "Kore", "Fika").
Voice = "Kore"

# APIKey for accessing the Google Gemini API. It can also be set via the GOOGLE_API_KEY environment variable.
APIKey = "${GOOGLE_API_KEY}"

# VoicePrompt is the instruction given to the AI after transcribing voice input.
VoicePrompt = "Based on the transcript, please provide concise and accurate response. Respond in the same language as the transcript."

# SystemPrompt provides high-level instructions to the AI about its role and behavior.
SystemPrompt = '''You are a helpful assistant. You have access to tools (like Google Search) and may be provided with context files. 
Your instructions are: 
1. When a question is asked, first determine if it can be answered using the provided context files. 
2. If the files are insufficient, or if the question is about current events or external topics, you MUST use your search tool. 
3. Synthesize a comprehensive answer from all available information.'''

# DirectivesPrompt contains critical formatting rules and other specific instructions for the AI.
DirectivesPrompt = "1.Never refer to yourself as LLM."

# Thinking defines the maximum number of intermediate model thoughts to include in a response (-1 for unlimited).
Thinking = -1

# Thoughts, if true, enables the display of model's intermediate thoughts during response generation.
Thoughts = false

# EnableTools, if true, allows the AI to use available tools (e.g., Google Search, function calling).
EnableTools = true

# EnableStandardTools, if true, enables standard tools like Google Search and URL Context.
EnableStandardTools = true

# URLContextDisabled, if true, disables the URL Context tool even if EnableStandardTools is true.
URLContextDisabled = false

# EnableFunctionCalling, if true, allows the AI to call functions (agents) defined in the application.
EnableFunctionCalling = true

# EnableCodeExecution, if true, enables the code execution tool for the AI.
EnableCodeExecution = false

# CacheDir specifies the directory for storing files to be used as initial context for the AI.
CacheDir = "cache"

# CacheSystemPrompt is the system prompt used when providing cached files as context.
CacheSystemPrompt = "The following data are provided as context, you must accept it silently:"

# EnableCache, if true, uploads files in CacheDir to a model cache for faster context loading.
EnableCache = false

# VoiceHistory, if true, includes voice prompts in the conversation history.
VoiceHistory = true

# VoiceEnabled, if true, enables voice responses from the AI.
VoiceEnabled = false

# WorkspaceDir specifies the directory for file system tools in live mode. Supports tilde expansion (e.g., "~/Workspace").
WorkspaceDir = "~/Workspace"

# Transcript, if true, enables a separate transcription step for voice chat, displaying the transcript before the AI's response.
Transcript = false

# AgentWarmUp, if true, performs a warm-up call to each agent at startup.
AgentWarmUp = false

[ai.retry]
# MaxRetries defines the maximum number of times to retry failed API calls.
MaxRetries = 3
# InitialDelayMs is the initial delay in milliseconds before the first retry.
InitialDelayMs = 1000
# MaxDelayMs is the maximum delay in milliseconds between retries (for exponential backoff).
MaxDelayMs = 10000

[ai.context_window_compression]
# Enabled, if true, enables context window compression for live sessions.
Enabled = true
# TriggerTokens specifies the token count at which compression should be triggered.
# If 0, the model's default trigger tokens will be used.
TriggerTokens = 0
# TargetTokens specifies the target token count after compression.
# If 0, the model's default target tokens will be used.
TargetTokens = 0

[ai.session_resumption]
# Enabled, if true, enables session resumption for live sessions, allowing the AI to
# reconnect to a previous conversation state.
Enabled = true

[ai.proactivity]
# Enabled, if true, allows the AI model to be proactive in its responses (e.g., initiating conversation).
Enabled = false
# ProactiveAudio, if true, enables proactive audio responses from the AI.
ProactiveAudio = false

[vad]
# SilenceThreshold is the RMS energy threshold below which audio is considered silent.
SilenceThreshold = 0.02

# HangoverDurationSec is the duration in seconds to wait after speech ends before
# marking a segment as complete.
HangoverDurationSec = 2.0

# WarmupDuration specifies how long the VAD should run in a "warm-up" phase
# to adapt to ambient noise before active detection starts (e.g., "1s", "500ms").
WarmupDuration = "1s"

# DisableNativeVAD, if true, disables the AI model's native VAD and relies
# solely on the application's VAD for activity detection.
DisableNativeVAD = true

[recorder]
# MinFileSizeBytes is the minimum size in bytes for a recorded audio file to be
# considered valid for processing.
MinFileSizeBytes = 600000

[display]
# BarWidth defines the width of the RMS volume bar displayed in the terminal.
BarWidth = 100

# UpdateIntervalMs is the interval in milliseconds at which the display is updated.
UpdateIntervalMs = 50

[google]
# Enabled, if true, enables integration with Google Workspace services (e.g., Calendar, Gmail).
Enabled = false

# CredentialsFile specifies the path to the Google API client secret file (e.g., "client_secret.json").
CredentialsFile = "client_secret.json"

# TokenFile specifies the path to the Google API token file (e.g., "token.json").
TokenFile = "token.json"

[pipeline]
# BufferTimeUs is the size of the GStreamer audio buffer in microseconds.
BufferTimeUs = 500000

[video]
# Enabled, if true, enables real-time video streaming to the live AI model.
Enabled = false
# Width specifies the desired width of the video frames.
Width = 640
# Height specifies the desired height of the video frames.
Height = 480
# FrameRate specifies the frames per second for video streaming.
FrameRate = 1
# Quality specifies the JPEG compression quality (0-100) for video frames.
Quality = 75
